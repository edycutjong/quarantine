version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Major bumps are migrations, not maintenance; they can break CI on a submitted, judged repo.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
