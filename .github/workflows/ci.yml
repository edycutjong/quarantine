name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pytest pyyaml ruff
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Offline tests (templates, fixtures, seeded toy repo, bench parser, setup.sh)
        run: python -m pytest -q tests
      - name: Submission readiness (files, repo links, no kitchen paths)
        run: python scripts/check_submission_readiness.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck setup.sh bench/*.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Full-history secret scan (gitleaks 8.30.1)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact --no-banner
